[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarebug-workbench"
version = "0.1.0"
description = "An offline, evidence-grounded agent workbench for synthetic rare-bug reproduction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
rarebug = "rarebug.cli:main"

[tool.setuptools]
packages = ["rarebug"]
