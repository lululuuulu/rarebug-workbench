name: offline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Scripted end-to-end demo
        run: python -m rarebug demo --scripted-approvals --out runs/ci-demo
      - name: Synthetic benchmark smoke check
        run: python -m rarebug evaluate --out runs/ci-evaluation --repeats 10
      - name: Public fixture checks
        run: python scripts/check_public.py
